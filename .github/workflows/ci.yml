name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Unit tests (the core's on the JVM and on Wasm), lint, the demo build and the website. Device
      # tests run on a real phone, not in CI.
      - run: ./gradlew test allTests lint assembleDebug :skylineqr-web:wasmJsBrowserDistribution
