<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfe0f2">
  <meta name="description" content="A link becomes a 3D city that folds flat into its own scannable QR code.">
  <title>Skyline QR</title>
  <link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="top">
      <span class="wordmark" aria-label="Skyline QR"><span class="mark" aria-hidden="true"></span>Skyline QR</span>
    </header>

    <div id="stage" class="stage" tabindex="0" role="button" aria-label="City QR code. Tap to show the code.">
      <canvas id="city"></canvas>
      <canvas id="flat" hidden></canvas>
      <p id="notice" class="notice" hidden></p>
    </div>

    <footer class="dock">
      <button id="stop" class="chip" hidden>Stop</button>
      <div id="controls" class="controls">
        <p id="error" class="error" role="status" aria-live="polite"></p>
        <div class="link-row">
          <label class="field">
            <span class="sr-only">Link</span>
            <input id="link-input" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="Paste a link or a payment code">
          </label>
          <button id="tour" class="square accent" aria-label="Fly the tour" title="Tour">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
          </button>
        </div>
        <div class="mode-row">
          <div class="modes" role="group" aria-label="Time">
            <button id="time-now" class="mode" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Now
            </button>
            <button id="time-day" class="mode" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Day
            </button>
            <button id="time-night" class="mode" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>Night
            </button>
          </div>
          <details class="more">
            <summary class="square" aria-label="More settings" title="More">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
            </summary>
            <div class="card sheet">
              <button id="postcard" class="wide">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>Share as a postcard
              </button>
              <div class="group">
                <span class="label">Weather</span>
                <div class="inline">
                  <div class="segmented" role="group" aria-label="Weather">
                    <button id="weather-clear" aria-pressed="true">Clear</button>
                    <button id="weather-storm" aria-pressed="false">Storm</button>
                    <button id="weather-haze" aria-pressed="false">Haze</button>
                  </div>
                  <button id="clouds" class="chip" aria-pressed="true">Clouds</button>
                </div>
              </div>
              <div class="group">
                <span class="label">City colours</span>
                <div class="segmented" role="group" aria-label="City colours">
                  <button id="colours-colourful" aria-pressed="true">Colourful</button>
                  <button id="colours-grey-blue" aria-pressed="false">Grey blue</button>
                </div>
              </div>
              <div id="city-settings" class="group">
                <span class="label">Long press</span>
                <div class="segmented" role="group" aria-label="Long press">
                  <button id="press-meteor" aria-pressed="true">Meteor</button>
                  <button id="press-fireworks" aria-pressed="false">Fireworks</button>
                </div>
                <span id="city-only" class="inline">
                  <button id="timelapse" class="chip">Timelapse</button>
                  <button id="reset" class="chip" hidden>Reset camera</button>
                </span>
                <label class="signs">
                  <span class="label">Sign board, a message a line</span>
                  <textarea id="signs-input" rows="2" spellcheck="false"></textarea>
                </label>
              </div>
            </div>
          </details>
        </div>
      </div>
    </footer>
  </main>
  <!-- The postcard, once made (page.js): share it where the browser can, or save it. -->
  <dialog id="postcard-dialog" class="postcard" aria-label="Postcard">
    <img id="postcard-image" alt="The city as a postcard, with its code in the corner">
    <div class="postcard-actions">
      <button id="postcard-close" class="chip">Close</button>
      <button id="postcard-save" class="chip">Save</button>
      <button id="postcard-share" class="chip accent" hidden>Share</button>
    </div>
  </dialog>
  <!-- A map of Kuala Lumpur while the city builds (tools/poster). page.js takes it away. -->
  <div id="poster" class="poster" role="status">
    <img src="kl-poster.webp" alt="" fetchpriority="high" decoding="async">
    <span class="poster-note">Building the city…</span>
  </div>
  <script src="gpu.js"></script>
  <script src="page.js"></script>
  <script type="application/javascript" src="skylineqr-web.js"></script>
</body>
</html>
